<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Selection Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        /* เอฟเฟกต์การกะพริบของ Skeleton */
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .animate-pulse {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="glass-card text-center">
        <!-- 1. Skeleton Loading (จะถูกซ่อนหลังจากโหลดเสร็จ) -->
        <div id="skeleton">
            <div class="h-8 bg-white/20 rounded-md w-3/4 mx-auto mb-2 animate-pulse"></div>
            <div class="h-4 bg-white/10 rounded-md w-1/2 mx-auto mb-8 animate-pulse"></div>
            
            <div class="space-y-4">
                <div class="h-14 bg-white/20 rounded-xl w-full animate-pulse"></div>
                <div class="h-14 bg-white/20 rounded-xl w-full animate-pulse"></div>
                <div class="h-14 bg-white/20 rounded-xl w-full animate-pulse"></div>
            </div>
        </div>

        <!-- 2. เนื้อหาจริง (ตอนแรกจะถูกซ่อนไว้) -->
        <div id="main-content" class="hidden">
            <h1 class="text-white text-2xl font-bold mb-1">กรุณาเลือกบริการที่ท่านต้องการ</h1>
            <p class="text-blue-100 text-sm mb-8">Please select the service you require</p>

            <div class="space-y-4">
                <a href="https://script.google.com/a/macros/wattano.ac.th/s/AKfycbzlgAlpXRdaFe7C_rDBYFeh622FbeIBOAfgybvqrxmv_H5QNUnMCL6PZ2quMrh-KCMJsg/exec" 
                   class="block w-full py-4 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl transition duration-300 border border-white/20 shadow-lg">
                    ระบบเช็คชื่อ
                </a>

                <a href="https://script.google.com/a/macros/wattano.ac.th/s/AKfycbyFyUvEPWGnPpTLPWr_2dEgeDLEE0Nm9uyXIhYh8QdfFUEHd1pBP70dOs9s057oadhSYw/exec" 
                   class="block w-full py-4 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl transition duration-300 border border-white/20 shadow-lg">
                    ระบบลา
                </a>

                <a href="https://drive.google.com/file/d/11QUVVY6_TUzyevOwuEdcwTcf-lWJh5_b/view?usp=drivesdk" 
                   class="block w-full py-4 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl transition duration-300 border border-white/20 shadow-lg">
                    วิดีโอขั้นตอนการใช้งาน
                </a>
            </div>
        </div>
    </div>

    <!-- 3. Footer -->
    <footer class="mt-8 text-white/50 text-xs">
        ©2026 Danudet. All Rights Reserved.
    </footer>

    <script>
        // จำลองเวลาการโหลด 1.5 วินาที
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('skeleton').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            }, 1500); 
        });
    </script>

</body>
</html>
